name: 주차 추가

on:
  workflow_dispatch:
    inputs:
      course:
        description: 강의
        type: choice
        options:
          - ai-agent
          - langchain
      week:
        description: 주차 (숫자, 예 2)
        required: true
      scope:
        description: 범위 (예 섹션 5 Harness Engineering)
        required: true
      date:
        description: 모임 날짜 (YYYY-MM-DD)
        required: true
  # 멤버 표가 바뀌면 아직 모임 전인 주차에 새 멤버 노트를 만든다
  push:
    branches: [main]
    paths: [README.md]

permissions:
  contents: write

# 실행이 겹치면 순서대로 돌려 푸시 충돌을 막는다
concurrency:
  group: add-week
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - name: 주차 폴더와 일정 표 갱신
        if: github.event_name == 'workflow_dispatch'
        run: python3 .github/scripts/add_week.py
        env:
          COURSE: ${{ inputs.course }}
          WEEK: ${{ inputs.week }}
          SCOPE: ${{ inputs.scope }}
          DATE: ${{ inputs.date }}

      - name: 새 멤버 노트 생성
        if: github.event_name == 'push'
        run: python3 .github/scripts/sync_members.py

      - name: 커밋 & 푸시
        env:
          MESSAGE: "${{ github.event_name == 'push' && 'docs: 새 멤버 노트 추가' || format('docs: {0} {1}주차 추가', inputs.course, inputs.week) }}"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "$MESSAGE"
          # 실행 중에 머지된 커밋이 있으면 그 위로 올린다
          git pull --rebase
          git push
